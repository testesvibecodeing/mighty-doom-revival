name: Revival server CI

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/server-ci.yml'
      - 'server/**'
      - 'docker-compose.yml'
  pull_request:
    paths:
      - 'server/**'
      - 'docker-compose.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        working-directory: server
        run: npm install

      - name: Syntax check
        working-directory: server
        run: npm run check

      - name: Prepare runtime config
        working-directory: server
        run: |
          cp config/revival.example.json config/revival.json
          cp config/packs.example.json config/packs.json
          cp config/events.example.json config/events.json

      - name: Smoke-test server
        working-directory: server
        env:
          HOST: 127.0.0.1
          PORT: 8080
          DB_PATH: ./runtime/ci.sqlite3
          REVIVAL_ADMIN_TOKEN: ci-only
        run: |
          npm start > /tmp/revival.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/revival/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/revival.log
          exit 1
