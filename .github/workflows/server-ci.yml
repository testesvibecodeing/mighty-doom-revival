name: Revival server CI

# Temporariamente manual: o GitHub está recusando iniciar runners nesta conta
# por configuração de Billing/Spending Limit. Reative push/pull_request quando
# Actions voltar a iniciar jobs normalmente.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install server dependencies
        working-directory: server
        run: npm install

      - name: Prepare runtime config
        working-directory: server
        run: |
          cp config/revival.example.json config/revival.json
          cp config/packs.example.json config/packs.json
          cp config/events.example.json config/events.json

      - name: Full server regression suite
        working-directory: server
        run: npm test

      - name: Revival HTTPS preflight regression
        run: python scripts/test_check_revival_server.py

      - name: Patcher exact-length regression
        run: python scripts/test_patch_apk.py

      - name: Patcher Android network-security regression
        run: python scripts/test_patch_network_security.py

      - name: Patcher primary Gear endpoint regression
        run: python scripts/test_patch_primary_api_host.py

      - name: Patcher bundle-aware orchestration regression
        run: python scripts/test_patcher_orchestration.py

      - name: Patcher bundle-aware logic regression
        run: python scripts/test_patch_unity_bundle.py

      - name: Raw Unity serialized string regression
        run: python scripts/test_patch_unity_raw_strings.py

      - name: Sanitized APK Unity mapper regression
        run: python scripts/test_inspect_apk_unity_candidates.py

      - name: Final APK endpoint verification regression
        run: python scripts/test_verify_patched_apk.py

      - name: Standalone health smoke
        working-directory: server
        env:
          HOST: 127.0.0.1
          PORT: 8080
          DB_PATH: ./runtime/ci.sqlite3
          REVIVAL_ADMIN_TOKEN: ci-only
        run: |
          npm start > /tmp/revival.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/revival/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 1
          done
          cat /tmp/revival.log
          exit 1
