name: Generate Revival PNG assets

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate-revival-png-assets.py'
      - 'scripts/refine-revival-png-assets.py'
      - '.github/workflows/generate-revival-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install Pillow

      - name: Generate base Revival artwork
        run: python scripts/generate-revival-png-assets.py

      - name: Replace shared placeholders with dedicated artwork
        run: python scripts/refine-revival-png-assets.py

      - name: Commit generated assets
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -A server/public/assets/img/revival server/public/assets/img/game server/src/assets.js
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "feat: replace generic artwork with dedicated Revival PNGs"
          git push
