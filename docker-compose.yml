services:
  revival-server:
    build: ./server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      HOST: 0.0.0.0
      PORT: 8080
      DB_PATH: /app/runtime/revival.sqlite3
      GAME_DATA_PATH: /app/data/game-data.json
      REVIVAL_CONFIG_PATH: /app/config/revival.json
      PACKS_CONFIG_PATH: /app/config/packs.json
      EVENTS_CONFIG_PATH: /app/config/events.json
      RESEARCH_MODE: "true"
      TRUST_PROXY: "true"
      REVIVAL_ADMIN_TOKEN: change-me
    volumes:
      - ./server/runtime:/app/runtime
      - ./server/public/download:/app/public/download
      - ./server/data:/app/data:ro
      - ./server/config:/app/config:ro
